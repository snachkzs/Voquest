<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Voquest — Authentication</title>
  <link rel="stylesheet" href="../styles/styles.css" />
</head>
<body>
  <main class="app-frame app-frame-auth">
    <section class="auth-left"></section>

    <section class="auth-right">
      <div class="auth-card">
        <img src="../assets/logo.svg" alt="Voquest" class="auth-logo"/>

        <div class="auth-toggle">
          <button id="loginBtn" class="toggle-btn active">Login</button>
          <button id="signupBtn" class="toggle-btn">Sign Up</button>
        </div>

        <form id="authForm" class="auth-form">
          <div class="field-row">
            <label>Email</label>
            <input type="email" id="email" placeholder="you@example.com" required />
          </div>

          <div class="field-row">
            <label>Password</label>
            <input type="password" id="password" placeholder="••••••••" required />
          </div>

          <div id="extraSignup" class="hidden">
            <div class="field-row">
              <label>Full name</label>
              <input type="text" id="fullname" placeholder="Your name" />
            </div>
            <div class="field-row">
              <label>Confirm password</label>
              <input type="password" id="password2" placeholder="••••••••" />
            </div>
          </div>

          <button id="submitBtn" class="btn auth-submit">Login</button>
        </form>
      </div>
    </section>
  </main>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-analytics.js";
    import {
      getAuth,
      createUserWithEmailAndPassword,
      signInWithEmailAndPassword,
      signOut,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";
    import {
      getFirestore,
      doc,
      setDoc,
      getDoc,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBtniUEeeYkmAzE7p_hQeubA-RKvwzLWDU",
      authDomain: "voquest-7ef97.firebaseapp.com",
      projectId: "voquest-7ef97",
      storageBucket: "voquest-7ef97.firebasestorage.app",
      messagingSenderId: "518215867323",
      appId: "1:518215867323:web:2b45ffa03c13e76864c29e",
      measurementId: "G-CEZZJ9YLTE"
    };

    const app = initializeApp(firebaseConfig);


    const auth = getAuth(app);
    const db = getFirestore(app);

    const loginBtn = document.getElementById('loginBtn');
    const signupBtn = document.getElementById('signupBtn');
    const extraSignup = document.getElementById('extraSignup');
    const submitBtn = document.getElementById('submitBtn');
    const authForm = document.getElementById('authForm');

    loginBtn.addEventListener('click', () => {
      loginBtn.classList.add('active');
      signupBtn.classList.remove('active');
      extraSignup.classList.add('hidden');
      submitBtn.textContent = 'Login';
      authForm.reset();
      document.getElementById('email').focus();
    });

    signupBtn.addEventListener('click', () => {
      signupBtn.classList.add('active');
      loginBtn.classList.remove('active');
      extraSignup.classList.remove('hidden');
      submitBtn.textContent = 'Sign up';
      authForm.reset();
      document.getElementById('email').focus();
    });

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        console.log('User signed in:', user.uid);
        try {
          const docRef = doc(db, 'users', user.uid);
          const snap = await getDoc(docRef);
          if (snap.exists()) {
            console.log('Profile:', snap.data());
          }
        } catch (err) { console.error('Error fetching profile', err); }
      } else {
        console.log('No user signed in');
      }
    });

    authForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (submitBtn.textContent.toLowerCase().includes('sign')) {
        const password2 = document.getElementById('password2').value;
        const fullname = document.getElementById('fullname').value.trim();
        if (password !== password2) {
          alert('Passwords do not match');
          return;
        }
        try {
          const userCredential = await createUserWithEmailAndPassword(auth, email, password);
          const uid = userCredential.user.uid;
          await setDoc(doc(db, 'users', uid), {
            email,
            displayName: fullname || null,
            createdAt: serverTimestamp(),
            progress: {}
          });
          alert('Registration successful — you are now signed in');
          window.location.href = 'index.html';
        } catch (err) {
          console.error(err);
          alert(err.message || 'Registration failed');
        }
      } else {
        try {
          await signInWithEmailAndPassword(auth, email, password);
          alert('Login successful');
          window.location.href = 'index.html';
        } catch (err) {
          console.error(err);
          alert(err.message || 'Login failed');
        }
      }
    });

    window.voquestAuth = {
      logout: async () => { try { await signOut(auth); alert('Signed out'); window.location.href = 'index.html'; } catch(e){console.error(e);} }
    };
  </script>
</body>
</html>
