<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Voquest — Home</title>

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&family=Yeseva+One&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../styles/styles.css" />
    <link rel="stylesheet" href="../styles/navbar.css" />
    <link rel="stylesheet" href="../styles/home.css" />
    <link rel="icon" type="image/svg+xml" href="../assets/logo.svg" />
    <meta name="description" content="Voquest – Vocabulary Quest: Fun English learning courses & quizzes." />
</head>
<body>
    <div id="nav-root"></div>

    <section class="hero-frame">
      <div class="hero-bg">
        <div class="blob b1"></div>
        <div class="blob b2"></div>
        <div class="blob b3"></div>
      </div>

      <div class="hero-content">
        <h1 class="hero-title">Build your English<br/>super‑vocab</h1>
        <p class="hero-sub">Collect words, level up through themed quests, and test your memory with adaptive quizzes designed to boost retention.</p>
        <div id="guestActions">
          <a class="btn-hero" id="getStartedBtn" href="authentication.html">Get Started →</a>
        </div>
        <div id="loggedActions" style="display:none; gap:12px; margin-top:12px;">
          <a class="btn-hero" id="exploreCourses" href="courses.html">Explore Courses</a>
          <a class="btn-hero" id="exploreQuizzes" href="quizzes.html">Explore Quizzes</a>
        </div>
      </div>
    </section>

    <footer>
      © <span id="y"></span> Voquest • Vocabulary Quest
    </footer>
    <script>
      document.getElementById('y').textContent = new Date().getFullYear();
    </script>

    <script type="module">
      import { onAuthStateChangedListener } from '../api/auth.js';

      const guestActions = document.getElementById('guestActions');
      const loggedActions = document.getElementById('loggedActions');
      if (guestActions) guestActions.style.display = '';
      onAuthStateChangedListener((user) => {
        if (user) {
          if (guestActions) guestActions.style.display = 'none';
          if (loggedActions) loggedActions.style.display = 'flex';
        } else {
          if (guestActions) guestActions.style.display = '';
          if (loggedActions) loggedActions.style.display = 'none';
        }
      });
    </script>

    <script type="module" src="../scripts/navbar.js"></script>
    <script src="../scripts/voquest-fn.js"></script>
</body>
</html>
