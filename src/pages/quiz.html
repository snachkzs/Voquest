<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Voquest Quiz</title>
  <link rel="stylesheet" href="../styles/styles.css" />
  <link rel="stylesheet" href="../styles/navbar.css" />
  <link rel="stylesheet" href="../styles/home.css" />
  <link rel="stylesheet" href="../styles/quizzes.css" />
</head>
<body>
  <div id="nav-root"></div>

  <section class="hero-frame" aria-hidden="true">
    <div class="hero-bg">
      <div class="blob b1"></div>
      <div class="blob b2"></div>
      <div class="blob b3"></div>
    </div>
  </section>

  <main class="quizzes-frame">
    <div class="quizzes-header-inner">
      <h1 class="quizzes-title page-title">Match The Synonyms</h1>
      <p class="quizzes-sub page-sub">Drag and drop each vocabulary term to its corresponding pair.</p>
    </div>
    <div class="progress-section">
      <article class="quiz-card">
        <div class="quiz-body">
          <h3 class="quiz-level">Your progress</h3>
          <div class="quiz-meta-row">
            <div class="quiz-meta-container">
              <div class="quiz-type">Level 1 - Easy</div>
            </div>
            <div class="xp-amount">0 XP</div>
          </div>
          <div class="quiz-progress-wrap">
            <div class="quiz-progress-bar"><i style="width:0%"></i></div>
            <div class="quiz-progress-text">0/0 Correct</div>
          </div>
          <div class="progress-caption">Question 1 of 5</div>
        </div>
      </article>
    </div>

    <div class="quiz-area">
      <div class="loading-card"><h3>Loading quiz…</h3></div>
    </div>

  </main>

  <script>
    const y = document.getElementById('y');
    if (y) y.textContent = new Date().getFullYear();
  </script>

  <script type="module">
    import { initQuizFromDocId } from '../scripts/quizzes.js';
    const params = new URLSearchParams(location.search);
    const id = params.get('id');
    if (id) initQuizFromDocId(id);
    else {
      const area = document.querySelector('.quiz-area');
      if (area) area.innerHTML = '<div class="loading-card">No quiz selected. <a href="quizzes.html">Back to quizzes</a></div>';
    }
  </script>

  <script type="module" src="../scripts/navbar.js"></script>
  <script src="../scripts/voquest-fn.js"></script>
</body>
</html>
